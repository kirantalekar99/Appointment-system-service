<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Appointment</title>
    <style>
:root {
  --brand: #176b87;
  --brand-dark: #0f4058;
  --accent: #eef7fa;
  --success: #138a5b;
  --danger: #b42318;
  --text: #1c2430;
  --muted: #5d6b7a;
  --border: #d7e0e7;
  --surface: #ffffff;
  --surface-soft: #f7fafc;
  --shadow: 0 10px 24px rgba(15, 64, 88, 0.08);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  color: var(--text);
  background: #f4f7fa;
}

a {
  color: inherit;
  text-decoration: none;
}

.page-wrapper {
  min-height: 100vh;
}

.page-container,
.top-nav {
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
}

.top-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: #ffffff;
  border-bottom: 1px solid var(--border);
}

.top-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  padding: 14px 0;
}

.logo-link {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  color: var(--brand-dark);
}

.logo-icon {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  color: white;
  background: var(--brand);
}

.menu-links {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  width: 100%;
  justify-content: flex-end;
}

.menu-links a {
  padding: 8px 10px;
  border-radius: 8px;
  color: var(--text);
  transition: color 0.2s ease, background 0.2s ease;
}

.menu-links a:hover {
  color: var(--brand-dark);
  background: var(--accent);
}

.menu-links a.active {
  color: var(--brand-dark) !important;
  background: var(--accent) !important;
}

.user-menu {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.user-label {
  font-size: 0.92rem;
  color: var(--brand-dark);
  font-weight: 700;
}

.login-link-btn,
.register-link-btn,
.admin-link-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 38px;
  font-weight: 700;
  border-radius: 8px;
  transition: background 0.2s ease, border-color 0.2s ease;
}

.login-link-btn {
  padding: 9px 14px;
  color: var(--brand-dark);
  background: #ffffff;
  border: 1px solid var(--border);
}

.register-link-btn {
  padding: 9px 14px;
  color: white;
  background: var(--brand);
}

.admin-link-btn {
  padding: 9px 14px;
  color: #fff7ef;
  background: #263238;
  border: 1px solid #263238;
}

.login-link-btn:hover,
.register-link-btn:hover,
.admin-link-btn:hover {
  background: var(--accent);
  border-color: var(--brand);
  color: var(--brand-dark);
}

.two-column-form {
  display: grid;
  grid-template-columns: minmax(320px, 390px) 1fr;
  gap: 24px;
  align-items: start;
  padding: 32px 0 56px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow);
  padding: 22px;
}

#bookingLeftCard {
  position: sticky;
  top: 92px;
}

#bookingLeftCard h2,
.side-box h2 {
  margin: 0 0 10px;
  font-size: 1.55rem;
  letter-spacing: 0;
}

#bookingMainText,
#appointmentListText {
  margin: 0 0 22px;
  line-height: 1.55;
}

.side-box {
  min-width: 0;
}

.form-fields {
  display: grid;
  gap: 14px;
}

.form-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

label {
  display: block;
  font-weight: 700;
  margin-bottom: 7px;
  color: #111827;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px 13px;
  border-radius: 8px;
  border: 1px solid var(--border);
  font: inherit;
  background: #fff;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
  outline: 3px solid rgba(23, 107, 135, 0.14);
  border-color: var(--brand);
}

#appointmentForm > button[type="submit"] {
  width: 100%;
  border: none;
  border-radius: 8px;
  padding: 12px 16px;
  cursor: pointer;
  font: inherit;
  font-weight: 700;
  color: #ffffff;
  background: var(--brand);
  transition: background 0.2s ease;
}

#appointmentForm > button[type="submit"]:hover {
  background: var(--brand-dark);
}

.message {
  display: none;
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 8px;
  font-weight: 600;
}

.message.show {
  display: block;
}

.message.success {
  background: #eaf8f1;
  color: var(--success);
}

.message.error {
  background: #fff2f0;
  color: var(--danger);
}

.appointment-list-area {
  display: grid;
  gap: 14px;
}

.appointment-list-area > .card {
  box-shadow: none;
  padding: 20px;
}

.appointment-list-area h3 {
  margin: 0 0 8px;
  font-size: 1.15rem;
}

.doctor-info-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 14px 0 12px;
}

.pill {
  display: inline-flex;
  align-items: center;
  padding: 7px 10px;
  border-radius: 8px;
  background: var(--surface-soft);
  border: 1px solid var(--border);
  color: var(--brand-dark);
  font-size: .92rem;
  font-weight: 700;
}

.muted {
  color: var(--muted);
}

.empty-box {
  text-align: center;
  padding: 24px;
  border: 1px dashed var(--border);
  border-radius: 8px;
  color: var(--muted);
  background: #ffffff;
}

.doctor-action-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.doctor-status-button {
  border: none;
  border-radius: 8px;
  padding: 11px 14px;
  cursor: pointer;
  font-weight: 700;
  color: #fff;
  background: var(--brand);
}

.patient-cancel-button {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 14px;
  cursor: pointer;
  font-weight: 700;
  color: #334155;
  background: #fff;
  box-shadow: none;
}

.doctor-status-button:hover {
  background: var(--brand-dark);
}

.patient-cancel-button:hover {
  border-color: #b7c7d3;
  background: var(--surface-soft);
}

.doctor-manage-panel {
  margin-top: 6px;
}

.popup-backdrop {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(17, 25, 39, .42);
  z-index: 50;
}

.popup-backdrop.show {
  display: flex;
}

.popup-card {
  width: min(620px, calc(100% - 24px));
}

.popup-top-row {
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 12px;
  margin-bottom: 18px;
}

.profile-link-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  min-height: 42px;
  border-radius: 8px;
  color: white;
  font-weight: 700;
  background: var(--brand);
}

@media (max-width:900px) {
  .two-column-form {
    grid-template-columns: 1fr;
  }

  .side-box {
    position: static;
  }

  #bookingLeftCard {
    position: static;
  }

  .top-nav {
    align-items: start;
    flex-direction: column;
  }
}

@media (max-width:640px) {
  .form-row {
    grid-template-columns: 1fr;
  }

  .card,
  .side-box {
    padding: 18px;
  }
}
  </style>
  </head>
  <body>
    <div class="page-wrapper">
      <header class="top-header">
        <div class="top-nav">
          <a class="logo-link" href="index.html">
            <span class="logo-icon">+</span>
            <span>CareBridge</span>
          </a>
          <nav class="menu-links">
            <a href="index.html">Home</a>
            <a href="doctors.html">Doctors</a>
            <a href="book.html" class="active">Booking</a>
            <a href="contact.html">Contact</a>
            <span id="headerUserArea"></span>
          </nav>
        </div>
      </header>

      <main class="page-container two-column-form">
        <section class="card" id="bookingLeftCard">
          <h2 id="bookingMainTitle">Book appointment</h2>
          <p id="bookingMainText" class="muted"></p>
          <form id="appointmentForm" class="form-fields">
            <div>
              <label for="doctorSelect">Select doctor</label>
              <select id="doctorSelect" required></select>
            </div>
            <div class="form-row">
              <div>
                <label for="visitDate">Appointment date</label>
                <input type="date" id="visitDate" required />
              </div>
              <div>
                <label for="visitTime">Time slot</label>
                <input
                  id="visitTime"
                  placeholder="Ex: 11:00 AM - 11:30 AM"
                  required
                />
              </div>
            </div>
            <div>
              <label for="visitReason">Symptoms / Reason for visit</label>
              <textarea
                id="visitReason"
                placeholder="Reason for consultation"
              ></textarea>
            </div>
            <button type="submit">Confirm Booking</button>
          </form>
          <div id="bookingMessage" class="message"></div>
        </section>

        <section class="side-box">
          <h2 id="appointmentListTitle">Your appointments</h2>
          <p id="appointmentListText" class="muted"></p>
          <div id="myAppointmentList" class="appointment-list-area"></div>
        </section>
      </main>
    </div>

    <template id="myAppointmentCardTemplate">
      <article class="card">
        <h3 data-field="doctorName"></h3>
        <p class="muted" data-field="specialization"></p>
        <div class="doctor-info-row">
          <span class="pill" data-field="date"></span>
          <span class="pill" data-field="time"></span>
          <span class="pill" data-field="status"></span>
        </div>
        <p><strong>Symptoms:</strong> <span data-field="symptoms"></span></p>
        <div class="doctor-action-row">
          <button type="button" class="doctor-status-button" data-field="rescheduleButton">Reschedule</button>
          <button type="button" class="patient-cancel-button" data-field="cancelButton">Cancel</button>
        </div>
      </article>
    </template>

    <template id="doctorAppointmentCardTemplate">
      <article class="card">
        <h3 data-field="patientName"></h3>
        <p class="muted">Doctor: <span data-field="doctorName"></span></p>
        <div class="doctor-info-row">
          <span class="pill" data-field="date"></span>
          <span class="pill" data-field="time"></span>
          <span class="pill" data-field="status"></span>
        </div>
        <p><strong>Symptoms:</strong> <span data-field="symptoms"></span></p>
        <div class="doctor-action-row">
          <select data-field="statusSelect">
            <option value="BOOKED">Accept / Booked</option>
            <option value="COMPLETED">Completed</option>
            <option value="CANCELLED">Cancelled</option>
          </select>
          <button type="button" class="doctor-status-button" data-field="updateButton">Update Status</button>
        </div>
      </article>
    </template>

    <template id="appointmentEmptyMessageTemplate">
      <div class="empty-box" data-field="message"></div>
    </template>

    <div id="reschedulePopup" class="popup-backdrop">
      <section class="card popup-card">
        <div class="popup-top-row">
          <div>
            <h3>Reschedule appointment</h3>
            <p class="muted">Update the date, time, or symptoms for your appointment.</p>
          </div>
          <button type="button" id="closeRescheduleButton" class="patient-cancel-button">Close</button>
        </div>
        <form id="rescheduleForm" class="form-fields">
          <input type="hidden" id="rescheduleAppointmentId" />
          <div class="form-row">
            <div>
              <label for="rescheduleDate">Appointment date</label>
              <input type="date" id="rescheduleDate" required />
            </div>
            <div>
              <label for="rescheduleTime">Time slot</label>
              <input id="rescheduleTime" required />
            </div>
          </div>
          <div>
            <label for="rescheduleSymptoms">Symptoms / Reason</label>
            <textarea id="rescheduleSymptoms"></textarea>
          </div>
          <div class="doctor-action-row">
            <button type="submit" class="doctor-status-button">Save Changes</button>
            <button type="button" id="cancelRescheduleButton" class="patient-cancel-button">Cancel</button>
          </div>
        </form>
      </section>
    </div>

    <script src="js/api.js?v=20260614-2"></script>
    <script src="js/book.js?v=20260613-1"></script>
  </body>
</html>
