<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <style>
:root {
  --brand: #1d6fa3;
  --brand-dark: #154f74;
  --accent: #e5f4fb;
  --text: #1c2430;
  --muted: #5d6b7a;
  --border: #dce7ee;
  --shadow: 0 20px 45px rgba(24, 74, 107, .12);
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

body {
  margin: 0;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  color: var(--text);
  background: radial-gradient(circle at top left, rgba(29, 111, 163, 0.16), transparent 30%), linear-gradient(180deg, #b1d4e2 0%, #b1d2e0a8 100%);
}

a { color: inherit; text-decoration: none; }

.page-wrapper { min-height: 100vh; }

.page-container, .top-nav {
  width: min(1120px, calc(100% - 32px));
  margin: 0 auto;
}

.top-header {
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(16px);
  background: rgba(255, 255, 255, 0.88);
  border-bottom: 1px solid rgba(220, 231, 238, 0.9);
}

.top-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  padding: 16px 0;
}

.logo-link {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 800;
  color: var(--brand-dark);
}

.logo-icon {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  color: white;
  background: linear-gradient(135deg, var(--brand) 0%, #4eb8bf 100%);
  box-shadow: var(--shadow);
}

.menu-links {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  width: 100%;
  justify-content: flex-end;
}

.menu-links a {
  padding: 10px 14px;
  border-radius: 999px;
  color: var(--text);
}

.user-menu {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}

.user-label { font-weight: 700; color: var(--brand-dark); }

.login-link-btn, .profile-link-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  border-radius: 999px;
  font-weight: 700;
}

.login-link-btn {
  padding: 10px 16px;
  color: var(--brand-dark);
  background: #fff;
  border: 1px solid rgba(29, 111, 163, 0.2);
}

.profile-link-btn {
  width: 42px;
  color: white;
  background: linear-gradient(135deg, var(--brand) 0%, #3fa0c5 100%);
}

.profile-layout { padding: 42px 0 64px; }

.profile-card {
  width: min(780px, 100%);
  margin: 0 auto;
  padding: 30px;
  background: rgba(255, 255, 255, .97);
  border: 1px solid rgba(220, 231, 238, .9);
  border-radius: 24px;
  box-shadow: var(--shadow);
}

.small-tag {
  display: inline-flex;
  padding: 8px 14px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--brand-dark);
  font-weight: 700;
}

.form-fields { display: grid; gap: 14px; }

.form-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

label { display: block; font-weight: 700; margin-bottom: 8px; }

input, textarea {
  width: 100%;
  padding: 13px 14px;
  border-radius: 14px;
  border: 1px solid var(--border);
  font: inherit;
  background: #fff;
}

textarea { min-height: 120px; resize: vertical; }

.button-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.save-button {
  border: none;
  border-radius: 16px;
  padding: 13px 18px;
  cursor: pointer;
  font-weight: 700;
  color: white;
  background: linear-gradient(135deg, var(--brand) 0%, #3fa0c5 100%);
}

.cancel-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 13px 18px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: white;
  color: var(--brand-dark);
  font-weight: 700;
}

.message { display: none; margin-top: 14px; padding: 12px 14px; border-radius: 14px; font-weight: 600; }
.message.show { display: block; }
.message.success { background: #ebfff7; color: #1e8e63; }
.message.error { background: #fff1f1; color: #c14646; }
.muted { color: var(--muted); }

@media (max-width: 900px) {
  .top-nav { align-items: start; flex-direction: column; }
}

@media (max-width: 640px) {
  .form-row { grid-template-columns: 1fr; }
  .profile-card { padding: 22px; }
}
  </style>
  </head>
  <body>
    <div class="page-wrapper">
      <header class="top-header">
        <div class="top-nav">
          <a class="logo-link" href="index.html">
            <span class="logo-icon">+</span>
            <span>CareBridge</span>
          </a>
          <nav class="menu-links">
            <a href="index.html">Home</a>
            <a href="doctors.html">Doctors</a>
            <a href="book.html">Booking</a>
            <a href="contact.html">Contact</a>
            <span id="headerUserArea"></span>
          </nav>
        </div>
      </header>

      <main class="page-container profile-layout">
        <section class="profile-card">
          <p class="small-tag">Profile</p>
          <h2 id="profileTitle">Your profile</h2>
          <p id="profileSubtitle" class="muted">Update your account information here.</p>

          <form id="profileForm" class="form-fields">
            <div class="form-row">
              <div>
                <label for="profileName">Full name</label>
                <input id="profileName" required />
              </div>
              <div>
                <label for="profilePhone">Phone number</label>
                <input id="profilePhone" maxlength="10" inputmode="numeric" required />
              </div>
            </div>
            <div class="form-row">
              <div>
                <label for="profileEmail">Email</label>
                <input id="profileEmail" type="email" required />
              </div>
              <div>
                <label for="profilePassword">New password</label>
                <input id="profilePassword" type="password" placeholder="Leave blank to keep current password" />
              </div>
            </div>

            <div id="doctorProfileFields" class="form-fields" hidden>
              <div class="form-row">
                <div>
                  <label for="profileSpecialization">Specialization</label>
                  <input id="profileSpecialization" />
                </div>
                <div>
                  <label for="profileExperience">Experience</label>
                  <input id="profileExperience" type="number" min="1" />
                </div>
              </div>
              <div class="form-row">
                <div>
                  <label for="profileAvailableDays">Available days</label>
                  <input id="profileAvailableDays" />
                </div>
                <div>
                  <label for="profileAvailableTime">Available time</label>
                  <input id="profileAvailableTime" />
                </div>
              </div>
              <div>
                <label for="profileBio">Bio</label>
                <textarea id="profileBio"></textarea>
              </div>
            </div>

            <div class="button-row">
              <button type="submit" class="save-button">Save Profile</button>
              <a href="index.html" class="cancel-link">Back to Home</a>
            </div>
          </form>
          <div id="profileMessage" class="message"></div>
        </section>
      </main>
    </div>

    <script src="js/api.js?v=20260614-2"></script>
    <script src="js/profile.js?v=20260613-1"></script>
  </body>
</html>
