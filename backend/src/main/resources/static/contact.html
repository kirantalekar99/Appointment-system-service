<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Support</title>
    <style>
:root {
  --brand: #176b87;
  --brand-dark: #0f4058;
  --accent: #eef7fa;
  --text: #1c2430;
  --muted: #5d6b7a;
  --border: #d7e0e7;
  --surface: #ffffff;
  --surface-soft: #f7fafc;
  --message-bg: #eee4d6;
  --shadow: 0 10px 24px rgba(15, 64, 88, 0.08);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  color: var(--text);
  background: #f4f7fa;
}

a {
  color: inherit;
  text-decoration: none;
}

.page-wrapper {
  min-height: 100vh;
}

.page-container,
.top-nav {
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
}

.top-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.top-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  padding: 14px 0;
}

.logo-link {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  color: var(--brand-dark);
}

.logo-icon {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  color: #ffffff;
  background: var(--brand);
}

.menu-links {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  width: 100%;
  justify-content: flex-end;
}

.menu-links a {
  padding: 8px 10px;
  border-radius: 8px;
  color: var(--text);
  transition: color 0.2s ease, background 0.2s ease;
}

.menu-links a:hover,
.menu-links a.active {
  color: var(--brand-dark);
  background: var(--accent);
}

.user-menu {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.user-label {
  font-size: 0.95rem;
  color: var(--brand-dark);
  font-weight: 700;
}

.login-link-btn,
.register-link-btn,
.admin-link-btn,
.profile-link-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 38px;
  border-radius: 8px;
  font-weight: 700;
  transition: background 0.2s ease, border-color 0.2s ease;
}

.login-link-btn {
  padding: 9px 14px;
  color: var(--brand-dark);
  background: #ffffff;
  border: 1px solid var(--border);
}

.register-link-btn {
  padding: 9px 14px;
  color: #ffffff;
  background: var(--brand);
}

.admin-link-btn {
  padding: 9px 14px;
  color: #ffffff;
  background: #263238;
  border: 1px solid #263238;
}

.profile-link-btn {
  width: 38px;
  color: #ffffff;
  background: var(--brand);
}

.login-link-btn:hover,
.register-link-btn:hover,
.admin-link-btn:hover,
.profile-link-btn:hover {
  color: var(--brand-dark);
  background: var(--accent);
  border-color: var(--brand);
}

.contact-page {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
  padding: 34px 0 52px;
}

.contact-panel {
  min-height: 430px;
  padding: 28px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.contact-info-panel {
  display: grid;
  align-content: start;
  gap: 20px;
}

.contact-info-panel h1 {
  margin: 0;
  font-size: clamp(2rem, 4vw, 3rem);
  line-height: 1.08;
  letter-spacing: 0;
}

.contact-info-panel p {
  max-width: 560px;
  margin: 0;
  color: var(--muted);
  font-size: 1rem;
  line-height: 1.7;
}

.contact-detail-list {
  display: grid;
  gap: 14px;
  margin-top: 8px;
}

.contact-detail {
  display: grid;
  gap: 4px;
}

.detail-label {
  color: var(--muted);
  font-size: 0.9rem;
  font-weight: 700;
}

.contact-detail strong {
  color: #0f172a;
}

.contact-form {
  display: grid;
  gap: 18px;
}

label {
  display: block;
  margin-bottom: 8px;
  font-weight: 700;
}

input,
textarea {
  width: 100%;
  padding: 13px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #ffffff;
  font: inherit;
}

textarea {
  min-height: 150px;
  background: var(--message-bg);
  resize: vertical;
}

input:focus,
textarea:focus {
  outline: 3px solid rgba(23, 107, 135, 0.14);
  border-color: var(--brand);
}

button {
  width: fit-content;
  min-height: 44px;
  padding: 11px 18px;
  border: 1px solid var(--brand);
  border-radius: 8px;
  color: #ffffff;
  background: var(--brand);
  cursor: pointer;
  font: inherit;
  font-weight: 700;
}

button:hover {
  background: var(--brand-dark);
  border-color: var(--brand-dark);
}

button:disabled {
  cursor: wait;
  opacity: 0.72;
}

.message {
  display: none;
}

.message.show {
  display: block;
  margin-top: 14px;
  padding: 11px 12px;
  border-radius: 8px;
  font-weight: 700;
}

.message.success {
  color: #15865c;
  background: #e9f8f0;
}

.message.error {
  color: #b42318;
  background: #fff1f1;
}

@media (max-width: 900px) {
  .top-nav {
    align-items: flex-start;
    flex-direction: column;
  }

  .menu-links {
    justify-content: flex-start;
  }

  .contact-page {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 640px) {
  .page-container,
  .top-nav {
    width: min(100% - 24px, 1180px);
  }

  .contact-page {
    padding-top: 22px;
  }

  .contact-panel {
    min-height: 0;
    padding: 20px;
  }

  button {
    width: 100%;
  }
}
  </style>
  </head>
  <body>
    <div class="page-wrapper">
      <header class="top-header">
        <div class="top-nav">
          <a class="logo-link" href="index.html">
            <span class="logo-icon">+</span>
            <span>CareBridge</span>
          </a>
          <nav class="menu-links">
            <a href="index.html">Home</a>
            <a href="doctors.html">Doctors</a>
            <a href="book.html">Booking</a>
            <a href="contact.html" class="active">Contact</a>
            <span id="headerUserArea"></span>
          </nav>
        </div>
      </header>

      <main class="page-container contact-page">
        <section class="contact-panel contact-info-panel">
          <h1>Talk to CareBridge support</h1>
          <p>
            For appointment booking, doctor onboarding, login, profile, or
            general support, send a message and our team will help you.
          </p>

          <div class="contact-detail-list">
            <div class="contact-detail">
              <span class="detail-label">Email</span>
              <strong>kirantalekar444@gmail.com</strong>
            </div>
            <div class="contact-detail">
              <span class="detail-label">Location</span>
              <strong>Baramati, Maharashtra, India</strong>
            </div>
            <div class="contact-detail">
              <span class="detail-label">Hours</span>
              <strong>8:00 AM - 9:00 PM</strong>
            </div>
          </div>
        </section>

        <section class="contact-panel contact-form-panel">
          <form id="contactForm" class="contact-form">
            <div>
              <label for="contactName">Name</label>
              <input id="contactName" placeholder="Your name" required />
            </div>
            <div>
              <label for="contactEmail">Email</label>
              <input
                type="email"
                id="contactEmail"
                placeholder="you@example.com"
                required
              />
            </div>
            <div>
              <label for="contactMessage">Message</label>
              <textarea
                id="contactMessage"
                placeholder="How can we help?"
                required
              ></textarea>
            </div>
            <button type="submit" id="contactSubmitButton">Contact us</button>
          </form>
          <div id="contactStatus" class="message"></div>
        </section>
      </main>
    </div>

    <script src="js/api.js?v=20260614-2"></script>
    <script src="js/contact.js?v=20260614-1"></script>
  </body>
</html>
