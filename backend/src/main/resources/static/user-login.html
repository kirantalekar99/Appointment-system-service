<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Login</title>
  <link rel="stylesheet" href="css/user-login.css?v=20260613-1" />
</head>

<body>
  <div class="page-wrapper auth-page user-auth-page">
    <header class="top-header">
      <div class="top-nav">
        <a class="logo-link" href="index.html">
          <span class="logo-icon">+</span>
          <span>CareBridge</span>
        </a>
        <nav class="menu-links">
          <a href="index.html">Home</a>
          <a href="doctors.html">Doctors</a>
          <a href="book.html">Booking</a>
          <a href="contact.html">Contact</a>
          <span id="headerUserArea"></span>
        </nav>
      </div>
    </header>

    <main class="page-container auth-page-center">
      <section class="card auth-form-box user-login-card">
        <h2 id="loginPageTitle">Patient Login</h2>
        <p id="loginPageText" class="muted">
          Patients can sign in here to book and manage appointments.
        </p>
        <div class="login-type-buttons user-type-buttons">
          <button type="button" id="patientLoginButton" class="type-button active">
            Patient Login
          </button>
          <button type="button" id="doctorLoginButton" class="type-button">
            Doctor Login
          </button>
        </div>
        <form id="loginForm" class="form-fields">
          <div>
            <label for="loginIdentifier">Email or mobile number</label>
            <input id="loginIdentifier" placeholder="Enter email or mobile number" required />
          </div>
          <div>
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required />
          </div>
          <a href="#" id="forgotPasswordLink" class="forgot-password-link">Forgot Password?</a>
          <div class="login-action-row">
            <button type="submit" id="loginButton">Login</button>
            <a href="register.html" class="create-account-link-btn">Create Account</a>
          </div>
        </form>
        <div id="loginStatus" class="message"></div>
      </section>
    </main>
  </div>

  <div id="forgotPasswordPopup" class="popup-backdrop">
    <section class="auth-form-box popup-card">
      <div class="popup-top-row">
        <h3>Reset Password</h3>
        <button type="button" id="closeForgotPasswordButton" class="small-action-button">
          Close
        </button>
      </div>
      <form id="forgotPasswordForm" class="form-fields">
        <div>
          <label for="forgotIdentifier">mail or mobile number</label>
          <input id="forgotIdentifier" placeholder="Enter your registered email or mobile number" required />
        </div>
        <div>
          <label for="forgotNewPassword">New password</label>
          <input type="password" id="forgotNewPassword" placeholder="Enter new password" required />
        </div>
        <div>
          <label for="forgotConfirmPassword">Confirm new password</label>
          <input type="password" id="forgotConfirmPassword" placeholder="Confirm new password" required />
        </div>
        <div class="popup-button-row">
          <button type="submit">Update Password</button>
          <button type="button" id="cancelForgotPasswordButton" class="small-action-button">
            Cancel
          </button>
        </div>
      </form>
      <div id="forgotPasswordStatus" class="message"></div>
    </section>
  </div>

  <script src="js/api.js?v=20260613-4"></script>
  <script src="js/login.js?v=20260408-1"></script>
</body>

</html>
