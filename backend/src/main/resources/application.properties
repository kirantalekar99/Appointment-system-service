spring.application.name=appointment-system
server.port=${PORT:1010}
server.address=0.0.0.0
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/appointment_db}}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:${MONGODB_DATABASE:appointment_db}}
spring.data.mongodb.auto-index-creation=${SPRING_DATA_MONGODB_AUTO_INDEX_CREATION:true}

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=${SPRING_JACKSON_SERIALIZATION_WRITE_DATES_AS_TIMESTAMPS:false}
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:always}

mail.brevo-base-url=${MAIL_BREVO_BASE_URL:${BREVO_BASE_URL:https://api.brevo.com}}
mail.brevo-api-key=${MAIL_BREVO_API_KEY:${BREVO_API_KEY:}}
app.mail.from=${APP_MAIL_FROM:${MAIL_FROM_EMAIL:}}
app.mail.sender-name=${APP_MAIL_SENDER_NAME:${MAIL_FROM_NAME:CareBridge}}
app.otp.expiry-minutes=${APP_OTP_EXPIRY_MINUTES:10}

app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.name=${APP_ADMIN_NAME:CareBridge Admin}
app.admin.phone=${APP_ADMIN_PHONE:9999999999}
